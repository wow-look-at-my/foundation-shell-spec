name: Claude Specification Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**/*.md"

jobs:
  spec-review:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to see the diff properly

      - name: Run Claude Specification Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          claude_args: --model claude-opus-4-5
          prompt: |
            Review the specification changes in this PR for quality issues.

            REPOSITORY: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}

            ## How to Review

            1. First, fetch the PR diff to see what changed
            2. Read the changed files in full for context
            3. Submit a PR review with inline comments on specific lines where you find issues
            4. Use GitHub's PR review API to annotate specific lines with your feedback

            When leaving inline comments:
            - Place the comment on the exact line with the issue
            - Be specific about what's wrong and how to fix it
            - Use severity prefixes: [CRITICAL], [MAJOR], [MINOR], [SUGGESTION]

            ## What to Check

            **Consistency**
            - Terminology used consistently throughout
            - Naming conventions followed
            - Cross-references accurate and up-to-date
            - No contradictions with existing specs

            **Clarity**
            - Requirements are unambiguous and testable
            - Technical terms are defined or commonly understood
            - Examples provided where helpful

            **Ambiguity**
            - Flag vague language ("should", "may", "might", "could", "appropriate", "reasonable")
            - Identify missing edge cases or boundary conditions
            - Note undefined behaviors or outcomes
            - Highlight implicit assumptions that should be explicit

            **Completeness**
            - All referenced items exist
            - Required sections present
            - Success/failure conditions defined
            - Dependencies and prerequisites stated

            ## Output Format

            After leaving inline comments, provide a summary comment with:
            1. **Overview**: Brief assessment of the spec quality
            2. **Issue Count**: Number of issues by severity
            3. **Key Concerns**: The most important items to address

            Submit the review with the appropriate status:
            - APPROVE: No critical or major issues found
            - REQUEST_CHANGES: Critical or major issues that must be addressed
            - COMMENT: Only minor issues or suggestions
